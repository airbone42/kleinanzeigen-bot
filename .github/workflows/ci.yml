name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: ruff check .

      - name: Tests (pytest)
        # Dummy env is provided by tests/conftest.py so settings import cleanly.
        run: pytest
